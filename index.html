<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body{
            background-image: url('images/background.jpg');
            padding: 5%;
            padding-left: 25%;
            padding-right: 25%;
        }
        div{
            align-items: center;
            padding: 5%;
            background-color: rgba(61, 64, 44, 0.263);
            padding-left: 5%;
            border-radius: 10px;
            margin-top: 15%;
        }
        h1{
            color: #16404D;
            font-size: 50px;
        }
        label{
            font-size: 25px;
            color: #042833;
        }
        
        .b1{
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            vertical-align: baseline;
            font-weight: 400;
            line-height: 1.29;
            letter-spacing: .16px;
            border-radius: 0;
            outline: 2px solid transparent;
            outline-offset: -2px;
            width: 100%;
            height: 40px;
            border: none;
            border-bottom: 1px solid #8d8d8d;
            background-color: #f4f4f4;
            padding: 0 16px;
            color: #161616;
            transition: background-color 70ms cubic-bezier(.2,0,.38,.9),outline 70ms cubic-bezier(.2,0,.38,.9);  
            :focus{
                outline: 2px solid #0f62fe;
                outline-offset: -2px;
            }
        }
                
       
.button-54 {
  font-family: "Open Sans", sans-serif;
  font-size: 16px;
  letter-spacing: 2px;
  text-decoration: none;
  text-transform: uppercase;
  color: #000;
  cursor: pointer;
  border: 3px solid;
  padding: 0.25em 0.5em;
  box-shadow: 1px 1px 0px 0px, 2px 2px 0px 0px, 3px 3px 0px 0px, 4px 4px 0px 0px, 5px 5px 0px 0px;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

.button-54:active {
  box-shadow: 0px 0px 0px 0px;
  top: 5px;
  left: 5px;
}

@media (min-width: 768px) {
  .button-54 {
    padding: 0.25em 0.75em;
  }
}
    </style>
</head>
<body>
    <div><center>
        <h1>Welcome Everyone</h1>
        <br>
        <button onclick="window.location.href='dashboard.html';" class="button-54">Get Started</button>
        <br><br><br>
        <h3 style="text-align: center;">Once you go back, the drawing's will fadeout</h3></center>
    </div>
</body>
</html>
